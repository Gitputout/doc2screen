name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python deps
        run: python -m pip install --upgrade pip pymupdf lxml
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Install OCR deps
        run: sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim ocrmypdf
      - name: Install Node deps
        run: npm ci --prefix tools
      - name: Check Chrome
        run: command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Python syntax
        run: python -m py_compile scripts/*.py
      - name: JavaScript syntax
        run: |
          node -c scripts/export_pdf.js
          node -c scripts/verify_html.js
      - name: Profile helper
        run: |
          python scripts/profile_helper.py \
            --inches 6.39 --aspect 16:9.5 \
            --page-ratio 0.706 --css-width 390 \
            --name phone-notes > /dev/null
      - name: Core regression checks
        run: python -m unittest discover -s tests
      - name: End-to-end smoke test
        run: bash tests/smoke.sh
