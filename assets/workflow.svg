<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Documents reflow into reading editions for different screens</title>
  <desc id="desc">PDF, DOCX, EPUB, Markdown and text are extracted into a semantic document model, then headings, paragraphs, images and tables are rearranged for phone, e-reader and tablet screens. The results can be HTML, EPUB or PDF.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#f5f8fc"/>
      <stop offset="1" stop-color="#e9f3f1"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop stop-color="#2861a6"/>
      <stop offset="1" stop-color="#237f79"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#244568" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1l7 4-7 4" fill="none" stroke="#32847e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .label{fill:#4a6175;font-size:16px;font-weight:700;letter-spacing:1.4px}
      .dark{fill:#17334d}.muted{fill:#60768a}.line{stroke:#b5c5d1;stroke-width:8;stroke-linecap:round}
      .small{font-size:13px}.mid{font-size:16px}.strong{font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1120" cy="66" r="120" fill="#d8ece9" opacity=".65"/>
  <circle cx="72" cy="564" r="145" fill="#e0e9f7" opacity=".8"/>
  <text x="52" y="62" class="dark strong" font-size="30">One document, readable on every screen</text>
  <text x="52" y="92" class="muted mid">Rebuild the content flow for each device, then package it in the format you need.</text>

  <text x="68" y="145" class="label">SOURCE FILES</text>
  <g filter="url(#shadow)">
    <rect x="55" y="169" width="230" height="295" rx="20" fill="#fff"/>
  </g>
  <g font-size="17" font-weight="700" fill="#29465f">
    <rect x="76" y="190" width="188" height="44" rx="11" fill="#e9f0fa"/><rect x="87" y="202" width="34" height="20" rx="5" fill="#d75b56"/><text x="91" y="217" fill="#fff" font-size="11">PDF</text><text x="133" y="219">PDF pages</text>
    <rect x="76" y="242" width="188" height="44" rx="11" fill="#e8f1fb"/><rect x="87" y="254" width="43" height="20" rx="5" fill="#447ebc"/><text x="91" y="269" fill="#fff" font-size="11">DOCX</text><text x="142" y="271">Word</text>
    <rect x="76" y="294" width="188" height="44" rx="11" fill="#e9f5ef"/><rect x="87" y="306" width="43" height="20" rx="5" fill="#3c916a"/><text x="91" y="321" fill="#fff" font-size="11">EPUB</text><text x="142" y="323">e-book</text>
    <rect x="76" y="346" width="188" height="44" rx="11" fill="#f3eefb"/><rect x="87" y="358" width="34" height="20" rx="5" fill="#8a62b6"/><text x="93" y="373" fill="#fff" font-size="11">MD</text><text x="133" y="375">Markdown</text>
    <rect x="76" y="398" width="188" height="44" rx="11" fill="#f8f1e7"/><rect x="87" y="410" width="34" height="20" rx="5" fill="#bb8a42"/><text x="91" y="425" fill="#fff" font-size="11">TXT</text><text x="133" y="427">Plain text</text>
  </g>

  <path d="M302 316h77" stroke="#32847e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="318" y="300" class="muted small">extract</text>
  <text x="402" y="145" class="label">SEMANTIC CONTENT</text>
  <g filter="url(#shadow)"><rect x="386" y="169" width="275" height="295" rx="20" fill="#fff"/></g>
  <rect x="407" y="190" width="233" height="42" rx="10" fill="url(#accent)"/>
  <text x="426" y="218" fill="#fff" font-size="20" font-weight="700">DocModel</text>
  <g class="dark" font-size="17">
    <circle cx="426" cy="263" r="5" fill="#3d8e88"/><text x="442" y="269">Headings and paragraphs</text>
    <circle cx="426" cy="310" r="5" fill="#3d8e88"/><text x="442" y="316">Lists and code</text>
    <circle cx="426" cy="357" r="5" fill="#3d8e88"/><text x="442" y="363">Tables and figures</text>
    <circle cx="426" cy="404" r="5" fill="#3d8e88"/><text x="442" y="410">Reading order and TOC</text>
  </g>
  <path d="M679 316h63" stroke="#32847e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="680" y="300" class="muted small">reflow</text>

  <text x="767" y="145" class="label">SCREEN PROFILES</text>
  <g filter="url(#shadow)">
    <rect x="758" y="191" width="106" height="234" rx="19" fill="#193d52"/>
    <rect x="765" y="205" width="92" height="202" rx="8" fill="#fff"/>
    <rect x="888" y="217" width="138" height="208" rx="16" fill="#315867"/>
    <rect x="896" y="228" width="122" height="187" rx="5" fill="#fffdf6"/>
    <rect x="1047" y="196" width="109" height="229" rx="16" fill="#426575"/>
    <rect x="1054" y="207" width="95" height="208" rx="5" fill="#fff"/>
  </g>
  <g fill="#285f7b">
    <rect x="775" y="219" width="62" height="8" rx="4"/><rect x="905" y="242" width="79" height="8" rx="4"/><rect x="1064" y="222" width="69" height="8" rx="4"/>
  </g>
  <g class="line">
    <path d="M775 243h58M775 260h67M775 277h57M775 330h64M775 347h55M775 364h66"/>
    <path d="M905 268h101M905 284h91M905 300h102M905 316h87M905 379h100M905 395h89"/>
    <path d="M1064 246h73M1064 261h66M1064 276h74M1064 347h75M1064 362h66M1064 377h73"/>
  </g>
  <rect x="775" y="294" width="70" height="23" rx="5" fill="#d8e9e4"/>
  <rect x="905" y="337" width="101" height="26" rx="5" fill="#e1e8d7"/>
  <rect x="1064" y="294" width="73" height="36" rx="5" fill="#d8e9e4"/>
  <text x="811" y="451" text-anchor="middle" class="dark strong mid">Phone</text>
  <text x="957" y="451" text-anchor="middle" class="dark strong mid">E-reader</text>
  <text x="1101" y="451" text-anchor="middle" class="dark strong mid">Tablet</text>
  <text x="811" y="472" text-anchor="middle" class="muted small">narrow lines</text>
  <text x="957" y="472" text-anchor="middle" class="muted small">comfortable type</text>
  <text x="1101" y="472" text-anchor="middle" class="muted small">wider layout</text>

  <rect x="52" y="518" width="1096" height="64" rx="17" fill="#dcebe9"/>
  <text x="77" y="557" class="dark strong mid">OUTPUT</text>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <rect x="246" y="529" width="219" height="42" rx="21" fill="#fff"/><text x="355" y="556" fill="#246d78">Responsive HTML</text>
    <rect x="492" y="529" width="219" height="42" rx="21" fill="#fff"/><text x="601" y="556" fill="#246d78">Reflowable EPUB</text>
    <rect x="738" y="529" width="219" height="42" rx="21" fill="#fff"/><text x="847" y="556" fill="#246d78">Screen-sized PDF</text>
  </g>
</svg>
